# kit.conf — qué significa "verificado" en AppStarter, y dónde vive el código.

FUENTES="App Packages"

verificaciones() {
    paso "Platform · build"  bash -c 'cd Packages/Platform && swift build'
    paso "Platform · tests"  bash -c 'cd Packages/Platform && swift test'
    paso "Features · build"  bash -c 'cd Packages/Features && swift build'
    paso "Features · tests"  bash -c 'cd Packages/Features && swift test'

    # La app y sus tests NO son opcionales, y esto se aprendió por las malas: con solo los
    # cuatro pasos de arriba, `verifica.sh` firmaba VERDE teniendo un fichero de
    # AppSnapshotTests que ni siquiera era Swift válido — nada lo compilaba. Todo lo que
    # vive fuera de los paquetes SPM (App/, AppTests, AppSnapshotTests, AppUITests) queda
    # sin verificar si no se nombra aquí.
    #
    # Cuesta más tiempo, y es el precio de que la firma signifique lo que dice. Si quieres
    # el número, mídelo: `time bash Scripts/verifica.sh` — un dato escrito aquí caduca y
    # nadie lo vuelve a comprobar.
    # Un solo paso, con `set -e` A PROPÓSITO: separados, un build en rojo dejaba al segundo
    # corriendo contra el bundle ANTERIOR y estampando un ✅ sobre artefactos viejos. Un
    # informe con un verde falso dentro es peor que uno todo rojo.
    paso "App · build + AppTests + AppSnapshotTests" bash -c '
        set -e
        D="platform=iOS Simulator,name=iPhone 17"
        xcodebuild build-for-testing -project AppStarter.xcodeproj -scheme AppStarter \
            -destination "$D" -skipPackagePluginValidation CODE_SIGNING_ALLOWED=NO -quiet
        xcodebuild test-without-building -project AppStarter.xcodeproj -scheme AppStarter \
            -destination "$D" -only-testing:AppTests -only-testing:AppSnapshotTests \
            CODE_SIGNING_ALLOWED=NO -quiet'

    # AppUITests se quedan FUERA a propósito: arrancan el simulador y tardan minutos. Van
    # en CI, no en cada verificación local. Límite declarado, no olvido — un cambio de UI
    # (chrome, navegación, accesibilidad) NO está cubierto por esta firma.
}
