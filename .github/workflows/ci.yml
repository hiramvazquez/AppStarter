name: CI

# NOTA para quien edite esto a mano: este fichero NO pasa por el motor de plantillas
# {{...}} de GenerateFeatureSupport (colisiona con la sintaxis ${{ }} de GitHub Actions).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  # Versión FIJA, no «la más reciente de la imagen»: ese selector validaba lo que trajera el
  # runner ese día y se movería solo el día que la imagen incorpore otra Xcode, sin que nadie
  # lo decida. La fijó el owner el 2026-09-17: es la que el CI ya ejecutaba de hecho y la más
  # nueva que ofrece macos-15. AppStarter no publica librerías, así que no hay un suelo más
  # bajo que comprobar.
  #
  # Comprobado el 2026-09-17 con
  #   gh api repos/actions/runner-images/contents/images/macos/macos-15-arm64-Readme.md
  # qué ofrece la imagen: 16.0 … 16.4, 26.0.1, 26.1.1, 26.2, 26.3. Ninguna 27: Xcode 27 solo
  # está en la imagen xcode-27, en preview (ver el job de aviso, abajo).
  #
  # Con el parche escrito, 26.3.0 y no 26.3: la action lo trata como un rango y con 26.3 se
  # quedaría sin avisar con un 26.3.x posterior si la imagen lo trae. Así, el día que la
  # imagen deje de traer esta, el job falla nombrándola en vez de validar otra.
  #
  # Al subirla, rehacer esa comprobación y actualizar la fecha.
  XCODE_SOPORTADO: "26.3.0"

jobs:
  showcase:
    name: check-showcase.sh (README escaparate)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Scripts/check-showcase.sh
        run: ./Scripts/check-showcase.sh

  packages:
    name: ${{ matrix.package }} (swift test + archlint)
    runs-on: macos-15
    timeout-minutes: 20
    strategy:
      matrix:
        package: [Platform, Features]
    steps:
      - uses: actions/checkout@v4

      - name: Seleccionar Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_SOPORTADO }}

      - name: Versiones
        run: |
          xcodebuild -version
          swift --version

      - name: swift test (Packages/${{ matrix.package }})
        working-directory: Packages/${{ matrix.package }}
        run: swift test

      - name: swift package archlint (Packages/${{ matrix.package }})
        working-directory: Packages/${{ matrix.package }}
        run: swift package archlint

      # Calidad de código (PRD-AF-09): SwiftLint --strict promueve los warning a error;
      # swift-format valida el formato con la misma configuración que la raíz del repo.
      - name: SwiftLint --strict + swift-format lint (Packages/${{ matrix.package }})
        working-directory: Packages/${{ matrix.package }}
        run: |
          brew install swiftlint
          swiftlint version
          swiftlint lint --strict --quiet --config ../../.swiftlint.yml Sources Tests
          swift format lint --strict --configuration ../../.swift-format --recursive Sources Tests

  app:
    name: "App (xcodebuild test: unit + snapshot + UI, offline)"
    runs-on: macos-15
    timeout-minutes: 30
    needs: packages
    env:
      # Horneada en el .xcscheme por xcodegen AL GENERAR (no leída del entorno del test
      # runner de XCUITest en tiempo de test — no llega ahí de forma fiable, ver
      # docs/INFORME-INTEGRACION.md) — por eso está en el `env:` del JOB, no del paso de
      # `xcodebuild test`: debe estar presente cuando corre `Scripts/bootstrap.sh`.
      UI_TEST_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Seleccionar Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_SOPORTADO }}

      - name: Versiones
        run: |
          xcodebuild -version
          swift --version

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project (Scripts/bootstrap.sh)
        run: ./Scripts/bootstrap.sh

      - name: Pick a simulator (iPhone 17 Pro if available, else newest iPhone)
        id: sim
        run: |
          NAME=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          devices = [d for runtime in data["devices"].values() for d in runtime if "iPhone" in d["name"]]
          preferred = [d for d in devices if d["name"] == "iPhone 17 Pro"]
          chosen = preferred[0] if preferred else (devices[-1] if devices else None)
          print(chosen["name"] if chosen else "")
          ')
          if [ -z "$NAME" ]; then
            echo "No se encontró ningún simulador de iPhone disponible" >&2
            exit 1
          fi
          echo "Simulador elegido: $NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: xcodebuild test (AppStarter, unit + UI, -UITestOffline)
        run: |
          xcodebuild -scheme AppStarter \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.name }}" \
            -skipPackagePluginValidation \
            -resultBundlePath TestResults.xcresult \
            test

      # Si un XCUITest falla en el runner (iOS distinto al local), el .xcresult con las
      # capturas y el árbol de accesibilidad es la única evidencia: se sube como artefacto.
      - name: Upload TestResults.xcresult (only on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults.xcresult
          path: TestResults.xcresult
          if-no-files-found: ignore

  integration:
    name: Integration (real DummyJSON)
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Seleccionar Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_SOPORTADO }}

      - name: Versiones
        run: |
          xcodebuild -version
          swift --version

      - name: Packages/Features integration tests (real DummyJSON)
        working-directory: Packages/Features
        env:
          INTEGRATION: "1"
        run: swift test --filter AuthIntegrationTests

  # Aviso temprano del toolchain con el que se DESARROLLA (Xcode 27 / Swift 6.4).
  #
  # Cubre el sentido CONTRARIO al de los jobs de arriba, y por eso no sobra ninguno de los dos:
  # los fijados en 26.3 protegen de escribir código que solo acepta Swift 6.4 —medido el
  # 2026-09-17: el diagnóstico [#IsolatedConformances] es error en 6.2.4 y no en 6.4—; este
  # protege de escribir código que solo acepta 26.3 y rompe al abrir el proyecto en Xcode 27.
  # Solo compila y prueba los dos paquetes: lo que tiene que ver es una incompatibilidad de
  # compilación, y montar el simulador en una imagen en preview sería ruido.
  #
  # NO bloquea, y es deliberado: xcode-27 es una imagen en PREVIEW, y una imagen en preview no
  # puede decidir si la corrida pasa.
  #
  # CONDICIÓN PARA VOLVERLO BLOQUEANTE: cuando la imagen xcode-27 salga de preview y su Xcode
  # sea estable. Seguimiento: https://github.com/actions/runner-images/issues/14404
  aviso-toolchain-desarrollo:
    name: Aviso temprano — Xcode 27 (${{ matrix.package }})
    runs-on: xcode-27
    continue-on-error: true
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        package: [Platform, Features]
    defaults:
      run:
        working-directory: Packages/${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4

      - name: Versiones
        run: |
          xcodebuild -version
          swift --version

      - name: swift build --build-tests
        run: swift build --build-tests

      - name: swift test
        run: swift test
