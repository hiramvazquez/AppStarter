name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Unit + UI (offline)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project (Scripts/bootstrap.sh)
        run: ./Scripts/bootstrap.sh

      - name: ArchitectureLint (AppStarterKit/Sources)
        working-directory: AppStarterKit
        run: swift package archlint --path Sources

      - name: AppStarterKit unit tests (swift test)
        working-directory: AppStarterKit
        run: swift test

      - name: Pick a simulator (iPhone 17 Pro if available, else newest iPhone)
        id: sim
        run: |
          NAME=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          devices = [d for runtime in data["devices"].values() for d in runtime if "iPhone" in d["name"]]
          preferred = [d for d in devices if d["name"] == "iPhone 17 Pro"]
          chosen = preferred[0] if preferred else (devices[-1] if devices else None)
          print(chosen["name"] if chosen else "")
          ')
          if [ -z "$NAME" ]; then
            echo "No se encontró ningún simulador de iPhone disponible" >&2
            exit 1
          fi
          echo "Simulador elegido: $NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: xcodebuild test (unit + UI, -UITestOffline)
        env:
          UI_TEST_OFFLINE: "1"
        run: |
          xcodebuild -scheme AppStarter \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.name }}" \
            -skipPackagePluginValidation \
            test

  integration:
    name: Integration (real DummyJSON)
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: AppStarterKit integration tests (real DummyJSON)
        working-directory: AppStarterKit
        env:
          INTEGRATION: "1"
        run: swift test --filter AuthIntegrationTests
