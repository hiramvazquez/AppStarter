schema: spec-driven

context: |
  Language: es
  All artifacts must be written in es.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.

  Proyecto: app iOS (deployment target iOS 17) con dos paquetes locales —
  Packages/Platform (dominio, networking, kits) y Packages/Features (un target por
  feature) — sobre los SPM propios AppFoundation y CoreNetworking. La cáscara App/ la
  genera xcodegen desde project.yml y no lleva lógica.

  Reglas de arquitectura: AGENTS.md y .archlint.yml (R13/R16) mandan sobre cualquier otra
  guía. Reglas de Swift/SwiftUI: .claude/skills/swift-swiftui.md.

  Verificación del proyecto: `/kit-verifica` (plugin ios-agent-kit) — build y tests de los
  dos paquetes más el informe de lógica repetida, firmado contra el sha256 del ÁRBOL DE
  TRABAJO Y DEL ÍNDICE (desde la 1.11.0 del kit; antes era solo el diff staged, y así se
  colaba un `git commit -am` con código sin verificar). Stagear después de firmar invalida
  la firma, así que stagear, verificar y commitear van en comandos separados. Los comandos
  concretos viven en `kit.conf`. Un cambio no se da por bueno sin esa firma.

rules:
  proposal:
    - 'Usa los encabezados que el CLI espera: "## Why" y "## What Changes". El archivado
       avisa si faltan (no bloquea, pero el aviso sale en cada cierre).'
    - 'Incluye siempre una sección "Fuera de alcance" con lo que NO se va a tocar.'
    - 'Incluye siempre "Criterios de aceptación" como lista de casillas, y cada criterio
       tiene que poder comprobarse mirando el resultado. "La carga es más fluida" no es un
       criterio; "UploadsView pasa el flag en false y hay un test que lo fija" sí lo es.'
    - 'Nombra los ficheros o módulos concretos que se van a tocar. Un criterio que dice
       "las pantallas que lanzan trabajo largo" no se puede verificar: di cuáles.'
    - 'Pero NO cuentes el resto del repo para justificarte. Enumerar lo que el cambio toca
       es alcance y muere con el cambio; "las otras siete features no exponen el caso" es
       una afirmación sobre código que no tocas, se archiva como norma y envejece sola.
       Escribe el criterio ("toda feature que lance X cumple Y"), o una medición con su
       fecha y el comando que la produjo. Nunca un censo a pelo.'
    - 'Y cuida el predicado: si cuentas por cómo se LLAMA algo y la regla habla de lo que
       SIGNIFICA, el censo y la regla no cubren lo mismo, y por el hueco se cuela un caso
       real. Ha pasado en este repo, con UploadsError.captureCancelled.'
  tasks:
    - 'La última tarea de todo cambio es `/kit-verifica` en verde.'
  design:
    - 'Solo si el cambio tiene decisiones técnicas de verdad. Un cambio sin decisiones no
       lleva design.md: lleva un proposal y sus tareas.'

operations:
  apply:
    guidance:
      - 'Antes de escribir una función nueva, comprueba que no exista ya con
         `/kit-duplicados`. Este repo llegó a tener mapError()
         repetido en cinco ficheros sin que nadie se diera cuenta.'
      - 'Si al implementar descubres que el acuerdo estaba mal, se corrige el ACUERDO por
         escrito y se dice. Lo prohibido es seguir adelante en silencio porque "es obvio
         que hace falta" — pasó de verdad, y lo cazó la aceptación.'
  archive:
    guidance:
      - 'El paso obligatorio antes de archivar es el REVISOR (`/kit-revisa`): ¿esto rompe algo?
         El juez (`/kit-acepta`) pregunta otra cosa —¿es lo ACORDADO?, criterio por criterio— y
         se invoca CUANDO NADIE VAYA A LEER EL ACUERDO CONTRA LO ENTREGADO: cambios grandes o
         que tocan varias capas (más de unos 5 ficheros), alcance que se movió al implementar,
         o cuando quien orquesta no es quien acordó.
         Es donde aparece el requisito que se evaporó por el camino, y en este repo ya pasó:
         la aceptación cazó un cambio que seguía adelante en silencio porque "era obvio que
         hacía falta". El revisor no lo ve porque no es su pregunta. Lo que decide cuándo
         pagar esa ronda eres tú, no una regla.'
      - 'Si pasaste el juez, su veredicto manda: no se archiva con ACUERDO-ROTO ni con un
         DEVUELTO del producto —una pieza que no hace lo acordado—. Con ACUERDO-ROTO se
         corrige el acuerdo primero, POR ESCRITO, y se vuelve a pasar. Con un DEVUELTO que NO
         es del producto —lo que queda es prosa— y el presupuesto de rondas agotado, decides
         tú: puedes archivar dejando la deuda escrita en el acuerdo. Esa salida existe porque
         sin ella un cambio cuyo producto está bien y cuya prosa sigue dando hallazgos no
         termina nunca.'
